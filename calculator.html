<!DOCTYPE html>
<html>

<head>
    <title>
        CALCULATOR
    </title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="calculating">
        <h1>CALCULATOR</h1>
        <b>
            <div class="textpad"><input type="text" placeholder="0" name="textpad" id="text">
        </b>
    </div><br>
    <div class="operation">
        <form>
            <div>
                <input type="button" value="AC" id="ac" onclick="clearDisplay()">
                <input type="button" value="DE" id="de" onclick="del()">
                <input type="button" value="." id="dot" onclick="valuename('.')">
                <input type="button" value="/" id="divide" onclick="valuename('/')">
            </div>
            <div>
                <input type="button" value="9" id="nine" onclick="valuename('9')">
                <input type="button" value="8" id="eight" onclick="valuename('8')">
                <input type="button" value="7" id="seven" onclick="valuename('7')">
                <input type="button" value="x" id="multi" onclick="valuename('x')">
            </div>
            <div>
                <input type="button" value="6" id="six" onclick="valuename('6')">
                <input type="button" value="5" id="five" onclick="valuename('5')">
                <input type="button" value="4" id="four" onclick="valuename('4')">
                <input type="button" value="-" id="minus" onclick="valuename('-')">
            </div>
            <div>
                <input type="button" value="3" id="three" onclick="valuename('3')">
                <input type="button" value="2" id="two" onclick="valuename('2')">
                <input type="button" value="1" id="one" onclick="valuename('1')">
                <input type="button" value="+" id="plus" onclick="valuename('+')">
            </div>
            <div>
                <input type="button" value="00" id="doublezero" onclick="valuename('00')">
                <input type="button" value="0" id="zero" onclick="valuename('0')">
                <input type="button" value="=" id="equal" onclick="calculate()">
            </div>
        </form>

    </div>
    <script src="add.js"></script>
</body>

</html>
